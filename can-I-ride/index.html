<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Can I Ride?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="../css/main.css" rel="stylesheet">
    <link href="css/can-I-ride.css" rel="stylesheet">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body onload="update()">
<main class="ride-app centered-div">
    <section class="ride-panel">
        <header class="ride-header">
            <div>
                <p class="ride-kicker">Bike commute forecast</p>
                <h1>Can I Ride?</h1>
            </div>
        </header>

        <div class="table-responsive weekly-table-wrap">
                    <table class="table align-middle weekly-table">
                        <thead>
                        <tr>
                            <th scope="col">Day</th>
                            <th scope="col">Morning (8AM)</th>
                            <th scope="col">Evening (5PM)</th>
                            <th scope="col">Can I ride?</th>
                        </tr>
                        </thead>
                        <tbody id="weekly_forecast"></tbody>
                    </table>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="js/can-I-ride.js"></script>
</body>
</html>
